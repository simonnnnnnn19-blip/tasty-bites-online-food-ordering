<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Successful - Tasty Bites</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f4;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        .success-box {
            background: white;
            max-width: 500px;
            margin: 60px auto;
            padding: 40px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ddd;
        }

        .icon {
            font-size: 75px;
        }

        h1 {
            color: #198754;
        }

        p {
            font-size: 17px;
            line-height: 1.7;
        }

        .order-id {
            background: #e8f5ec;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
        }

        .home-btn {
            display: inline-block;
            background: #198754;
            color: white;
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 7px;
            margin-top: 20px;
        }

        .home-btn:hover {
            background: #146c43;
        }
    </style>
</head>

<body>

<div class="success-box">

    <div class="icon">🎉</div>

    <h1>Order Placed Successfully!</h1>

    <p>Thank you for ordering from Tasty Bites!</p>

    <div class="order-id">
        Your Order ID: #{{ order_id }}
    </div>

    <h2>Total Amount: ₹{{ total }}</h2>

    <p>Your delicious food is being prepared.</p>

    <a href="/" class="home-btn">
        Continue Shopping
    </a>

</div>

</body>
</html>
