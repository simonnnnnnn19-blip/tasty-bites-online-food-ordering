<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Tasty Bites</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f4;
            margin: 0;
            color: #333;
        }

        header {
            background: #198754;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        .order-summary {
            background: #eaf5ed;
            padding: 20px;
            border-radius: 10px;
            margin-top: 25px;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            color: #198754;
        }

        button {
            width: 100%;
            background: #198754;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #146c43;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #198754;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>🛒 Customer Checkout</h1>
    <p>Complete your food order</p>
</header>

<div class="container">

    <h2>Customer Details</h2>

    <form method="POST">

        <div class="form-group">
            <label>Full Name</label>

            <input
                type="text"
                name="customer_name"
                placeholder="Enter your full name"
                maxlength="80"
                required>
        </div>

        <div class="form-group">
            <label>Mobile Number</label>

            <input
                type="tel"
                name="phone"
                placeholder="Enter mobile number"
                maxlength="20"
                required>
        </div>

        <div class="form-group">
            <label>Delivery Address</label>

            <textarea
                name="address"
                rows="4"
                maxlength="300"
                placeholder="Enter your delivery address"
                required></textarea>
        </div>

        <div class="order-summary">

            <h2>Order Summary</h2>

            {% for item in items %}

            <p>
                {{ item.name }}
                × {{ item.quantity }}

                <strong style="float:right">
                    ₹{{ item.subtotal }}
                </strong>
            </p>

            {% endfor %}

            <hr>

            <p class="total">
                Total Amount: ₹{{ total }}
            </p>

        </div>

        <br>

        <button type="submit">
            Place My Order
        </button>

    </form>

    <a href="/cart" class="back">
        ← Back to Cart
    </a>

</div>

</body>
</html>
